    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /contact.html
    envVars:
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
